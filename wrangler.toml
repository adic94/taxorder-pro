name = "taxorder-pro-api"
main = "worker/index.js"
compatibility_date = "2025-01-01"
account_id = "bb17d1d7a681084f377fd23989f29d7f"

[[d1_databases]]
binding = "DB"
database_name = "taxorder-pro"
database_id = "f8d0df7f-5e05-4841-acc2-7a465a1bea2a"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "taxorder-docs"

[[kv_namespaces]]
binding = "PREFS"
id = "859d284aa75c49598186c70d5e2cdbc2"

[ai]
binding = "AI"

# Codziennie o 3:00 UTC — czyszczenie wygasłych sesji (worker/index.js: scheduled())
[triggers]
crons = ["0 3 * * *"]

# Kolejka powiadomień (push/email/sms) — producer + consumer w tym samym workerze
[[queues.producers]]
queue = "taxorder-pro-notifications"
binding = "NOTIF_QUEUE"

[[queues.consumers]]
queue = "taxorder-pro-notifications"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 3

[vars]
ENVIRONMENT = "production"
VAPID_PUBLIC_KEY = "BLb0fmlA2iRulkwWHEIwQKYEnIWCvsRjQR55MHuxoKSNV7tczQ7Tr0cb-5Zo6N6C34UqIz10Or-ZV2eDQwd-EPE"
OCR_PYTHON_URL = "https://taxorder-pro-production.up.railway.app"
SUPABASE_URL = "https://opeqckxxdqicszfycolb.supabase.co"
# OCR_PYTHON_SECRET — ustaw jako Cloudflare Secret (szyfrowany):
# npx wrangler secret put OCR_PYTHON_SECRET
# SUPABASE_ANON_KEY — ustaw jako Cloudflare Secret (szyfrowany):
# npx wrangler secret put SUPABASE_ANON_KEY

