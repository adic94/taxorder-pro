<!DOCTYPE html>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="styles/fleet-manager.css">
<script>
async function loadAssets(){
  if(window._DT1_PDF_BYTES && window._DT1A_PDF_BYTES && window._ROBOTO_BYTES) return;
  const load = async (url) => {
    const r = await fetch(url, { cache: 'no-store' });
    if(!r.ok) throw new Error(url + ' HTTP ' + r.status);
    return new Uint8Array(await r.arrayBuffer());
  };
  window._DT1_PDF_BYTES = await load('./assets/DT1formularz.pdf');
  window._DT1A_PDF_BYTES = await load('./assets/DT1Azalacznik.pdf');
  window._ROBOTO_BYTES = await load('./assets/Roboto.ttf');
  console.log('[Assets] PDF-y i czcionka załadowane z assets/');
}
window.addEventListener('DOMContentLoaded', () => {
  loadAssets().catch(e => console.warn('[Assets] Nie udało się załadować zasobów:', e));
});
</script>
<script src="pdf-lib.min.js"></script>
<script src="fontkit.umd.min.js"></script>

<body>
<!-- ==================== EKRAN LOGOWANIA ==================== -->
<div id="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:2rem">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.5rem;width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08)">

      <label style="font-size:13px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500">Adres e-mail</label>

    </div>
    <div style="margin-bottom:18px">
      <label style="font-size:13px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500">Hasło</label>
      <input type="password" id="login-pass" class="fi" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button onclick="doLogin()" id="login-btn" class="btn btn-blue" style="width:100%;justify-content:center;padding:12px;font-size:15px">
      <i class="ti ti-login"></i>Zaloguj się

    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:14px;line-height:1.6">

</div>

      <button class="tnb" id="tnb-dash" onclick="showPage('dash')"><i class="ti ti-chart-bar"></i>DT-1</button>
      <button class="tnb" id="tnb-pojazdy" onclick="showPage('pojazdy')"><i class="ti ti-list"></i>Flota <span class="badge" id="badge-sel">0</span></button>
      <button class="tnb" id="tnb-formularze" onclick="showPage('formularze')"><i class="ti ti-file"></i>Deklaracje</button>
      <button class="tnb" id="tnb-raporty" onclick="showPage('raporty')"><i class="ti ti-chart-line"></i>Raporty</button>

      <button class="tnb" id="tnb-uzytkownicy" onclick="showPage('uzytkownicy')"><i class="ti ti-users"></i>Admin</button>
    </nav>
   <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
     <label style="font-size:12px;color:var(--text2)">Rok:</label>

     </select>
   </div>

     <div id="user-avatar" style="width:28px;height:28px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">A</div>
     <div>
