name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
  # Ręczne uruchomienie — do zweryfikowania zmian w SAMYM workflow (jak przejście
  # na cloudflare/wrangler-action), których `paths:` wyżej nie łapie. Bez tego
  # jedyną drogą sprawdzenia poprawki deployu jest zmiana w worker/** — czyli
  # testowanie na prawdziwej zmianie produkcyjnej, dokładnie wtedy, gdy nie chcemy
  # dwóch niewiadomych naraz.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      # Oficjalna akcja Cloudflare zamiast ręcznego `npm install -g wrangler@X` —
      # ten manualny wzorzec dwukrotnie psuł deploy (patrz CLAUDE.md, sekcja
      # Zamknięte: "Rozjazd wersji Wranglera ujednolicony" i "Hotfix: wrangler
      # wymaga Node.js >=22"): wersja była trzymana ręcznie zsynchronizowana
      # w trzech plikach workflow, a wymagania Node zmieniały się między
      # patchami bez ostrzeżenia w ogólnym changelogu migracji. Akcja sama
      # dobiera zgodny Node — osobny krok setup-node nie jest potrzebny.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.120.1'
