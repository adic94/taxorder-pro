name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
  # Ręczne uruchomienie — do zweryfikowania zmian w SAMYM workflow (jak przejście
  # na cloudflare/wrangler-action), których `paths:` wyżej nie łapie. Bez tego
  # jedyną drogą sprawdzenia poprawki deployu jest zmiana w worker/** — czyli
  # testowanie na prawdziwej zmianie produkcyjnej, dokładnie wtedy, gdy nie chcemy
  # dwóch niewiadomych naraz.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Pełny audyt przed wdrożeniem
        run: npm run audit:all

      # Worker faz A–F odwołuje się do ręcznych migracji v54–v57. Publikacja
      # przed ich wykonaniem dawałaby błędy 500, dlatego brak choć jednej tabeli
      # blokuje deploy zamiast pozostawiać częściowo działającą produkcję.
      - name: Preflight zdalnego D1 — migracje v54–v57
        run: node tools/autotest/operations-release-preflight.js --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Oficjalna akcja Cloudflare zamiast ręcznego `npm install -g wrangler@X` —
      # ten manualny wzorzec dwukrotnie psuł deploy (patrz CLAUDE.md, sekcja
      # Zamknięte: "Rozjazd wersji Wranglera ujednolicony" i "Hotfix: wrangler
      # wymaga Node.js >=22"): wersja była trzymana ręcznie zsynchronizowana
      # w trzech plikach workflow, a wymagania Node zmieniały się między
      # patchami bez ostrzeżenia w ogólnym changelogu migracji. Akcja sama
      # dobiera zgodny Node — osobny krok setup-node nie jest potrzebny.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.120.1'
