name: Nightly — raport stanu + auto-deploy schematów DB

on:
  schedule:
    # Każdej nocy o 03:30 UTC (05:30 czasu polskiego)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  # ─── Job 1: Sprawdź czy są nowe schematy do migracji ────────────────────────
  migrate-schemas:
    name: Auto-migracja nowych schematów D1
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Sprawdź czy są nowe pliki schema_v*.sql
        id: schema_check
        run: |
          # Znajdź najwyższy numer schematu w repo
          LATEST=$(ls worker/schema_v*.sql 2>/dev/null | grep -oP 'v\K[0-9]+' | sort -n | tail -1)
          echo "latest_schema=$LATEST" >> $GITHUB_OUTPUT
          echo "Najwyższy schemat w repo: v$LATEST"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@4.120.1

      # ⚠ Ten krok był PRZEZ DŁUGI CZAS DESTRUKCYJNY — trzy niezależne defekty:
      #
      #  1. Glob `worker/schema_v*.sql` dopasowywał TAKŻE pliki `schema_vNN_ROLLBACK.sql`,
      #     a leksykograficznie każdy z nich trafiał TUŻ PO swojej migracji
      #     (schema_v48.sql → schema_v48_ROLLBACK.sql). Baza co noc tworzyła tabele
      #     i natychmiast je kasowała: companies, user_company_access, ksef_config,
      #     vignettes, hr_leaves, debt_collection, company_packages, user_prefs_kv i inne.
      #     To, a nie „migracja nigdy nie zastosowana", jest powodem braków w D1.
      #
      #  2. Glob powłoki sortuje LEKSYKOGRAFICZNIE, więc v2 wykonywało się po v19,
      #     a v5 po v49 — migracje szły w złej kolejności. Naprawione przez `sort -V`.
      #
      #  3. `|| echo "błąd lub już wykonany"` zrównywał realną awarię z powtórnym
      #     uruchomieniem i zawsze kończył się kodem 0. Import D1 z `--file` jest
      #     transakcyjny per plik: JEDEN błędny statement wycofuje CAŁY plik, więc
      #     „duplicate column name" w pliku z nową tabelą oznacza, że ta tabela też
      #     nie powstała. Ten komunikat ukrywał dokładnie taki przypadek.
      #
      # Krok NIE przerywa się na błędzie — o zdrowiu bazy decyduje weryfikacja niżej,
      # która porównuje faktyczny stan D1 z repo. Błąd w pliku, który i tak nic nie
      # wnosi, nie powinien blokować nocnego przebiegu; brakująca tabela — powinien.
      - name: Uruchom migracje (bez plików ROLLBACK, w kolejności numerycznej)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          FAILED=0
          FILES=$(ls worker/schema_v*.sql | grep -v '_ROLLBACK' | sort -V)
          echo "Do uruchomienia: $(echo "$FILES" | wc -l) plików (pliki ROLLBACK pominięte)"
          for f in $FILES; do
            echo "▶ $f"
            if OUT=$(wrangler d1 execute taxorder-pro --remote --file="$f" 2>&1); then
              echo "   ok"
            else
              FAILED=$((FAILED+1))
              echo "   ❌ plik wycofany w całości przez D1 — nic z niego nie zostało zastosowane:"
              echo "$OUT" | grep -iE "ERROR|SQLITE" | head -3 | sed 's/^/      /'
            fi
          done
          echo ""
          echo "Plików zakończonych błędem: $FAILED"

      # Właściwa bramka: czy baza faktycznie wygląda tak, jak zakłada repo.
      # `migration-check` porównuje pliki między sobą i na to pytanie NIE odpowiada.
      - name: Weryfikacja zgodności D1 z repo (bramka)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/autotest/d1-schema-diff.js --strict

  # ─── Job 2: Raport JS syntax check ──────────────────────────────────────────
  syntax-check:
    name: Nocna weryfikacja składni JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sprawdź składnię wszystkich plików JS
        run: |
          ERRORS=0
          for f in app.js sw.js modules/*.js worker/index.js; do
            if [ -f "$f" ]; then
              node --check "$f" 2>/dev/null || { echo "❌ Błąd składni: $f"; ERRORS=$((ERRORS+1)); }
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "❌ Znaleziono $ERRORS plików z błędami składni"
            exit 1
          else
            echo "✅ Wszystkie pliki JS mają poprawną składnię"
          fi

  # ─── Job 3: Security monitor — nullable company_id (§9 WERYFIKACJA_v44) ─────
  security-nullcheck:
    name: Security — nullable company_id monitor
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@4.120.1

      - name: Sprawdź użytkowników bez company_id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf 'SELECT COUNT(*) AS n FROM users WHERE company_id IS NULL AND active = 1;\n' \
            > /tmp/nullable_check.sql

          RESULT=$(wrangler d1 execute taxorder-pro --remote \
            --file=/tmp/nullable_check.sql --json 2>/dev/null || echo "")

          N=$(echo "$RESULT" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d[0]['results'][0]['n'])" \
            2>/dev/null || echo "")

          if [ -z "$N" ]; then
            echo "⚠️  Nie udało się odczytać wyniku z D1 (błąd wrangler lub tokenu) — pomijam."
            exit 0
          fi

          echo "users WHERE company_id IS NULL AND active=1 → n=$N"

          if [ "$N" -gt 0 ]; then
            echo ""
            echo "❌ SECURITY ALERT: $N aktywnych użytkowników z company_id = NULL"
            echo ""
            echo "Wzorzec 'if (user.company_id && user.company_id !== company)'"
            echo "w poniższych handlerach staje się osiągalny — napraw przed kolejnym releasem."
            echo ""
            echo "  L3098  handleFmQueue"
            echo "  L3865  handleGpsWebhook"
            echo "  L3981  handleFuelWebhook"
            echo "  L11972 handleFuelImportScheduler"
            echo "  L12216 handleDebtCollection"
            echo "  L12450 handleExternalAccess"
            echo "  L12494 handleDriverRanking"
            echo "  L12603 handleRouteProfitability"
            echo ""
            echo "Patrz: docs/WERYFIKACJA_v44.md §9"
            exit 1
          fi

          echo "✅ Wzorzec nieosiągalny — 0 aktywnych użytkowników z company_id NULL"

  # ─── Job 4: Statystyki repozytorium ─────────────────────────────────────────
  stats:
    name: Statystyki projektu
    runs-on: ubuntu-latest
    needs: [syntax-check]

    steps:
      - uses: actions/checkout@v4

      - name: Wygeneruj statystyki
        run: |
          echo "## 📊 Statystyki TaxOrder Pro — $(date -u '+%Y-%m-%d')"
          echo ""
          echo "### Rozmiary plików kluczowych"
          wc -l worker/index.js app.js index.html modules/*.js | sort -rn | head -20
          echo ""
          echo "### Liczba modułów"
          ls modules/*.js | wc -l
          echo ""
          echo "### Schematy D1"
          ls worker/schema_v*.sql
          echo ""
          echo "### Ostatnie commity"
          git log --oneline -10
