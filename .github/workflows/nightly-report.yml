name: Nightly — raport stanu + auto-deploy schematów DB

on:
  schedule:
    # Każdej nocy o 03:30 UTC (05:30 czasu polskiego)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  # ─── Job 1: Sprawdź czy są nowe schematy do migracji ────────────────────────
  migrate-schemas:
    name: Auto-migracja nowych schematów D1
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Sprawdź czy są nowe pliki schema_v*.sql
        id: schema_check
        run: |
          # Znajdź najwyższy numer schematu w repo
          LATEST=$(ls worker/schema_v*.sql 2>/dev/null | grep -oP 'v\K[0-9]+' | sort -n | tail -1)
          echo "latest_schema=$LATEST" >> $GITHUB_OUTPUT
          echo "Najwyższy schemat w repo: v$LATEST"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Uruchom wszystkie schematy (idempotentne — CREATE IF NOT EXISTS)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bb17d1d7a681084f377fd23989f29d7f
        run: |
          for f in worker/schema_v*.sql; do
            echo "▶ Uruchamiam $f..."
            wrangler d1 execute taxorder-pro --remote --file="$f" || echo "⚠ $f — błąd lub już wykonany"
          done

  # ─── Job 2: Raport JS syntax check ──────────────────────────────────────────
  syntax-check:
    name: Nocna weryfikacja składni JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sprawdź składnię wszystkich plików JS
        run: |
          ERRORS=0
          for f in app.js sw.js modules/*.js worker/index.js; do
            if [ -f "$f" ]; then
              node --check "$f" 2>/dev/null || { echo "❌ Błąd składni: $f"; ERRORS=$((ERRORS+1)); }
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "❌ Znaleziono $ERRORS plików z błędami składni"
            exit 1
          else
            echo "✅ Wszystkie pliki JS mają poprawną składnię"
          fi

  # ─── Job 3: Security monitor — nullable company_id (§9 WERYFIKACJA_v44) ─────
  security-nullcheck:
    name: Security — nullable company_id monitor
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Sprawdź użytkowników bez company_id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bb17d1d7a681084f377fd23989f29d7f
        run: |
          printf 'SELECT COUNT(*) AS n FROM users WHERE company_id IS NULL AND active = 1;\n' \
            > /tmp/nullable_check.sql

          RESULT=$(wrangler d1 execute taxorder-pro --remote \
            --file=/tmp/nullable_check.sql --json 2>/dev/null || echo "")

          N=$(echo "$RESULT" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d[0]['results'][0]['n'])" \
            2>/dev/null || echo "")

          if [ -z "$N" ]; then
            echo "⚠️  Nie udało się odczytać wyniku z D1 (błąd wrangler lub tokenu) — pomijam."
            exit 0
          fi

          echo "users WHERE company_id IS NULL AND active=1 → n=$N"

          if [ "$N" -gt 0 ]; then
            echo ""
            echo "❌ SECURITY ALERT: $N aktywnych użytkowników z company_id = NULL"
            echo ""
            echo "Wzorzec 'if (user.company_id && user.company_id !== company)'"
            echo "w poniższych handlerach staje się osiągalny — napraw przed kolejnym releasem."
            echo ""
            echo "  L3098  handleFmQueue"
            echo "  L3865  handleGpsWebhook"
            echo "  L3981  handleFuelWebhook"
            echo "  L11972 handleFuelImportScheduler"
            echo "  L12216 handleDebtCollection"
            echo "  L12450 handleExternalAccess"
            echo "  L12494 handleDriverRanking"
            echo "  L12603 handleRouteProfitability"
            echo ""
            echo "Patrz: docs/WERYFIKACJA_v44.md §9"
            exit 1
          fi

          echo "✅ Wzorzec nieosiągalny — 0 aktywnych użytkowników z company_id NULL"

  # ─── Job 4: Statystyki repozytorium ─────────────────────────────────────────
  stats:
    name: Statystyki projektu
    runs-on: ubuntu-latest
    needs: [syntax-check]

    steps:
      - uses: actions/checkout@v4

      - name: Wygeneruj statystyki
        run: |
          echo "## 📊 Statystyki TaxOrder Pro — $(date -u '+%Y-%m-%d')"
          echo ""
          echo "### Rozmiary plików kluczowych"
          wc -l worker/index.js app.js index.html modules/*.js | sort -rn | head -20
          echo ""
          echo "### Liczba modułów"
          ls modules/*.js | wc -l
          echo ""
          echo "### Schematy D1"
          ls worker/schema_v*.sql
          echo ""
          echo "### Ostatnie commity"
          git log --oneline -10
