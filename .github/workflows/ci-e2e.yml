name: E2E & API tests

on:
  push:
    branches: [main]
    # Suite Playwright trwa ~28 min. Zmiany czysto dokumentacyjne nie mogą go zmienić,
    # a uruchamiały pełny przebieg — na prywatnym repo to minuty z pakietu Actions.
    paths-ignore: ['**.md', 'docs/**', 'CLAUDE.md']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'CLAUDE.md']
  workflow_dispatch:
  schedule:
    # TYGODNIOWO, poniedziałek 02:00 UTC (04:00 czasu polskiego) — nie codziennie.
    #
    # Zmierzone 12.08.2026, gdy pakiet 2000 min wyczerpał się 12. dnia miesiąca:
    # jeden przebieg tego suite'u to ~28 min wall-time w JEDNYM jobie, a GitHub
    # nalicza per job z zaokrągleniem w górę. Codzienny cron to 840 min/mies. —
    # 42% całego pakietu na prywatnym repo. Razem z health-check (co 4 h, 180 min)
    # i nocnym raportem (4 joby, 120 min) same harmonogramy zjadały 1140 min, czyli
    # 57% limitu, ZANIM ktokolwiek cokolwiek wypchnął. Na pracę zostawało 30 przebiegów.
    #
    # Tygodniowo: harmonogramy schodzą do 412 min (21%), na PR-y zostaje 56 przebiegów.
    # Codzienny przebieg i tak w większości powielał to, co robią PR-y — pełny suite
    # leci na każdym pushu do main i na każdym PR. Nocny łapie wyłącznie dryf zewnętrzny
    # (zmiana w produkcyjnym API, wygasłe poświadczenia testowe), a to zjawiska tygodniowe,
    # nie dobowe.
    #
    # Monitoring produkcji ŚWIADOMIE nietknięty — health-check co 4 h zostaje. To jedyne,
    # co pilnuje działającej produkcji; oszczędzać należy na teście, który się powiela,
    # nie na czujniku, który jako jedyny coś widzi.
    #
    # Doraźnie, gdy trzeba tu i teraz: zakładka Actions → „Run workflow" (workflow_dispatch).
    - cron: '0 2 * * 1'

# Nowy push do tej samej gałęzi anuluje poprzedni, jeszcze biegnący przebieg.
# Bez tego KAŻDY commit uruchamiał osobny, pełny suite i wszystkie biegły do końca,
# choć liczył się wyłącznie ostatni. Przy sześciu commitach do jednej gałęzi to
# pięć przebiegów po ~28 min wyrzuconych w błoto.
# `main` wyłączony z anulowania: tam każdy commit ma mieć własny, kompletny wynik.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      # Eslint nie byl uruchamiany w zadnym workflow — dlatego blad no-script-url
      # w generatorze bookmarkletu DT-1 przelezal niezauwazony wsrod 2168 ostrzezen.
      # Bramka lapie tylko BLEDY (eslint konczy sie 0 przy samych ostrzezeniach);
      # nie dodawaj --max-warnings 0 bez wczesniejszego posprzatania ostrzezen.
      - name: Lint (bramka na bledy, nie na ostrzezenia)
        run: npm run lint

      - name: Zainstaluj Chromium
        run: npx playwright install chromium --with-deps

      - name: Uruchom serwer lokalny
        run: npx http-server . -p 3000 -c-1 --silent &

      - name: Poczekaj aż serwer odpowie
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done

      - name: Testy E2E (login + in-browser suite + kokpit + karta pojazdu)
        run: npm run test:e2e
        env:
          TEST_URL: http://localhost:3000
          TEST_EMAIL:   ${{ secrets.TEST_EMAIL || '' }}
          TEST_PASS:    ${{ secrets.TEST_PASS || '' }}
          TEST_COMPANY: ${{ secrets.TEST_COMPANY || '' }}

      - name: Testy API (tylko gdy podano TEST_URL produkcyjny)
        if: ${{ vars.PROD_WORKER_URL != '' }}
        run: npm run test:api
        env:
          TEST_URL:     ${{ vars.PROD_WORKER_URL || '' }}
          TEST_EMAIL:   ${{ secrets.TEST_EMAIL || '' }}
          TEST_PASS:    ${{ secrets.TEST_PASS || '' }}
          TEST_COMPANY: ${{ secrets.TEST_COMPANY || '' }}

      # Regresja "cichych zer": fuel_entries nie istniala w D1, a wszystkie zapytania do
      # niej mialy .catch(), wiec CO2/paliwo w ESG i zrodlo "Paliwo" w kreatorze raportow
      # zwracaly zera bez zadnego bledu. Asercje sa RELATYWNE wzgledem /api/co2-report
      # (to samo zrodlo, te same wskazniki), wiec test nie zalezy od stanu danych na koncie.
      - name: Testy raportowania ESG + kreatora raportow
        if: ${{ vars.PROD_WORKER_URL != '' }}
        run: npm run test:esg
        env:
          TEST_URL:     ${{ vars.PROD_WORKER_URL || '' }}
          TEST_EMAIL:   ${{ secrets.TEST_EMAIL || '' }}
          TEST_PASS:    ${{ secrets.TEST_PASS || '' }}
          TEST_COMPANY: ${{ secrets.TEST_COMPANY || '' }}

      # Konto adamus1000@gmail.com (TEST_EMAIL) ma rolę admin i celowo pomija scoping
      # firmy (worker/index.js:8673-8680) — nie wykryje regresji w gatingu uprawnień
      # zwykłych użytkowników. Ten krok loguje się osobnym, nie-adminowym kontem
      # (kierownik/gcon, założone 2026-08-10) i asertuje 403 na próbach cross-tenant.
      - name: Testy izolacji tenantów (konto nie-admin)
        if: ${{ vars.PROD_WORKER_URL != '' }}
        run: npm run test:isolation
        env:
          TEST_URL:              ${{ vars.PROD_WORKER_URL || '' }}
          TEST_EMAIL_NONADMIN:   ${{ secrets.TEST_EMAIL_NONADMIN || '' }}
          TEST_PASS_NONADMIN:    ${{ secrets.TEST_PASS_NONADMIN || '' }}
          TEST_COMPANY_NONADMIN: gcon

      - name: Upload raportu Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: tests/results/html/
          retention-days: 14
