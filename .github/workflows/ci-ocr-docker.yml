name: OCR Docker build

on:
  push:
    branches: [main]
    paths:
      - 'ocr-service/**'
  pull_request:
    paths:
      - 'ocr-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OCR Docker image
        run: docker build ./ocr-service
