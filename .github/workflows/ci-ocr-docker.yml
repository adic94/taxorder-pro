name: OCR — testy i Docker build

on:
  push:
    branches: [main]
    paths:
      - 'ocr-service/**'
  pull_request:
    paths:
      - 'ocr-service/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zainstaluj zależności systemowe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-pol tesseract-ocr-eng \
            poppler-utils libgomp1
      - name: Zainstaluj zależności Pythona
        working-directory: ocr-service
        run: pip install --quiet -r requirements.txt pytest
      - name: Uruchom testy pytest
        working-directory: ocr-service
        run: pytest tests/ -q --tb=short

  build:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Zbuduj obraz Docker OCR
        run: docker build ./ocr-service
