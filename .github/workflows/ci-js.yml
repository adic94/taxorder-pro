name: JS syntax check

on:
  push:
    branches: [main]
  pull_request:

# Bramki jednostkowe trwają ~15 s, więc oszczędność jest niewielka — ale nadmiarowe
# przebiegi i tak zajmują runnery, których pula jest wspólna z suitem Playwright.
concurrency:
  group: js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, nie 20: tests/unit/migration-apply-test.js używa wbudowanego
      # `node:sqlite` (dostępny od 22.5). Node 20 jest zresztą wycofywany
      # z runnerów GitHuba — ostrzeżenie widać w logach nocnego przebiegu.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax (node --check)
        run: |
          set -e
          for f in app.js sw.js; do
            [ -f "$f" ] && node --check "$f"
          done
          for f in modules/*.js worker/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      # node --check waliduje app.js, ale NIE kod, ktory app.js emituje jako tekst
      # (bookmarklet DT-1 -> Warszawa). Ten test parsuje i uruchamia wygenerowany
      # skrypt oraz sprawdza escapowanie danych. Bez zaleznosci - nie wymaga npm ci.
      - name: Bookmarklet DT-1 → Warszawa (regresja)
        run: node tests/unit/warsaw-bookmarklet-test.js

      # Straznik nocnego automatu migracji. Glob `worker/schema_v*.sql` dopasowywal
      # takze pliki *_ROLLBACK.sql, ktore leksykograficznie wykonywaly sie tuz po
      # swoich migracjach i kasowaly wlasnie utworzone tabele. Zaden inny test tego
      # nie widzial: migration-check porownuje pliki schema miedzy soba, a d1-schema-diff
      # wymaga dostepu do bazy. Ten dziala statycznie, bez sieci i bez zaleznosci.
      - name: Straznik globa migracji (ROLLBACK, kolejnosc)
        run: node tests/unit/migration-glob-test.js

      # migration-glob-test pilnuje, CZEGO automat nie odpali. Ten test sprawdza,
      # co z odpalonego faktycznie POWSTAJE: uruchamia wszystkie schema_v*.sql na
      # prawdziwym silniku SQL, dwukrotnie, odtwarzajac transakcyjnosc D1 per plik.
      # Lapie migracje, ktore gubia tabele przez wycofanie calego pliku (tak ginely
      # 4 tabele powiadomien z schema_v8), oraz falszywe alarmy bramki d1-schema-diff.
      - name: Straznik migracji — co faktycznie powstaje w bazie
        run: node tests/unit/migration-apply-test.js

      # Tabela `vehicles` nie ma plaskich kolumn status/active/reg/brand/model/fuel_type/
      # vin — te dane siedza w kolumnie JSON `data`. Zapytania pisane tak, jakby kolumny
      # istnialy, sa poprawnym JS i poprawnym SQL, wiec nie widzi ich ani node --check,
      # ani eslint, ani Playwright. Konczyly sie 500 (GET /api/fleet-kpi, bez .catch())
      # albo cichymi zerami (liczniki floty, udzial EV, wyszukiwarka QR). Ten test bierze
      # KAZDE zapytanie do vehicles i przygotowuje je na schemacie z schema_v*.sql —
      # db.prepare() w SQLite waliduje nazwy kolumn.
      - name: Straznik kolumn — zapytania do vehicles kontra realny schemat
        run: node tests/unit/vehicles-columns-test.js

      # Formularz tankowania zapisuje pb95/pb98/cng/elektryk, a tablica wskaznikow miala
      # klucze petrol/gasoline/electric i wyszukiwala po ROWNOSCI — cztery z szesciu
      # wartosci cicho ladowaly na default 2.5, w tym pojazd elektryczny. Test czyta
      # wartosci wprost z <select id="fm-ftype"> w index.html, wiec dodanie nowego paliwa
      # w UI bez wskaznika wywala CI.
      - name: Straznik wskaznikow CO2 — kazde paliwo z UI ma wskaznik
        run: node tests/unit/co2-factors-test.js

      # Front i backend trzymaja DWIE niezalezne kopie listy zrodel i kolumn kreatora
      # raportow, a obie potrafily rozjechac sie ze schematem bazy. Kazde zapytanie ma
      # .catch(), wiec efektem byla pusta tabela bez bledu — tak zachowywalo sie zrodlo
      # "Paliwo" (fuel_entries) i "Pojazdy" (kolumny reg/brand/model, ktorych nie ma).
      # Wpiety dopiero teraz, bo do naprawy zrodla "Pojazdy" test swiecil na czerwono
      # z powodu dlugu, nie regresji.
      - name: Straznik kreatora raportow — spojnosc zrodel i kolumn
        run: node tests/unit/report-sources-test.js

      # Oplata za korzystanie ze srodowiska. Test pilnuje przede wszystkim tego, ze przy
      # BRAKU stawek wyliczenie ODMAWIA, zamiast zwrocic zero — zerowa naleznosc wobec
      # urzedu marszalkowskiego wyglada wiarygodnie i nikt jej nie zakwestionuje.
      # Pilnuje tez pulapki jednostek: stawka jest na Mg, dane w litrach, wiec
      # przeliczenie wymaga gestosci, roznej dla kazdego paliwa.
      - name: Straznik oplat srodowiskowych — brak stawek nie moze dac zera
        run: node tests/unit/env-fee-test.js

      - name: DT-1 — zapis PDF/ePUAP w programie + organ wg gminy siedziby
        run: node tests/unit/dt1-epuap-test.js

      # claude.yml dostaje `contents: write` i ANTHROPIC_API_KEY, a wyzwalaczem jest
      # TRESC komentarza. Bez sprawdzenia autora wystarczy napisac "@claude ...", zeby
      # dostac agenta z prawem zapisu — a push do worker/** to deploy na produkcje.
      # Test wyciaga warunek `if:` wprost z workflow i ewaluuje go na syntetycznych
      # zdarzeniach. Zweryfikowany negatywnie: na wersji sprzed naprawy 4 przypadki
      # obcej osoby przechodza (6 PASS / 5 FAIL).
      - name: Straznik uprawnien do claude.yml — obcy nie uruchomi agenta
        run: node tests/unit/claude-workflow-guard-test.js

      # migration_v50 przebudowuje esg_targets przez DROP + RENAME i w chwili dodania
      # tego kroku NIE jest jeszcze zastosowana na produkcji. Test uruchamia ja na
      # wiernie odtworzonej strukturze v35 i pilnuje trzech rzeczy latwych do zepsucia
      # edycja pliku: przeliczenia CO2 kg->t (inaczej cele 1000x zawyzone), usuniecia
      # starego indeksu UNIQUE (inaczej model v41 blokuje sie na drugiej metryce w roku)
      # oraz tego, ze doslowny INSERT z worker/index.js wykonuje sie na nowej strukturze.
      - name: Straznik migracji v50 — esg_targets bez utraty danych
        run: node tests/unit/migration-v50-test.js

      # Import dowodu przyjmuje PDF-y (skany). Renderowalismy je jednym ustawieniem
      # dobranym pod OCR — scale 2.0 (=144 DPI) i przekompresowanie do JPEG 0.92 —
      # co dla OCR jest nieszkodliwe, a dla kodu Aztec zabojcze: modul ma przy tej
      # gestosci ~1 piksel, a JPEG dokłada artefakty DCT dokladnie na jego krawedziach.
      # Test jest statyczny (czyta zrodlo), wiec nie wymaga przegladarki ani PDF-a.
      # Zweryfikowany negatywnie: na wersji sprzed naprawy 0 PASS / 6 FAIL.
      - name: Straznik renderu PDF — Aztec dostaje 300 DPI bez kompresji stratnej
        run: node tests/unit/dr-pdf-render-test.js

      # CVE-2024-4367: pdf.js < 4.2.67 pozwala spreparowanemu PDF-owi wykonac DOWOLNY
      # JavaScript w origin strony, gdy isEvalSupported zostaje na domyslnym true.
      # Aplikacja laduje pdf.js 3.11.174 i renderuje nim pliki WGRYWANE PRZEZ UZYTKOWNIKOW
      # (dowody, polisy, faktury), a token sesji lezy w localStorage tego samego origin.
      # Zweryfikowany negatywnie: przed naprawa 6 wywolan bez zabezpieczenia, po nazwie i linii.
      - name: Straznik pdf.js — wgrany PDF nie moze wykonac kodu
        run: node tests/unit/pdfjs-eval-test.js

      # Aplikacja deklarowala DWIE rozne wersje ZXing: index.html 0.19.1 (zwykly <script>)
      # i app.js 0.20.0 (wstrzykiwany). Wygrywala 0.19.1, bo loadZXing() zwraca wczesnie
      # przy istniejacym window.ZXing — linia z 0.20.0 byla martwa. Cale sledztwo nad
      # zniekształcaniem bajtow Aztec prowadzilismy na 0.20.0 z node_modules, czyli na
      # wersji, ktorej produkcja NIE uruchamia. Naprawa okazala sie sluszna takze dla
      # 0.19.1, ale sprawdzilismy to dopiero po fakcie.
      - name: Straznik wersji ZXing — jedna wersja, ta sama w testach
        run: node tests/unit/zxing-version-test.js

      # index.html laduje 9 bibliotek z trzech obcych hostow. Bez `integrity` przegladarka
      # wykona DOWOLNA tresc, ktora ten host odda — a skrypt dziala w origin aplikacji,
      # gdzie w localStorage lezy token sesji. SRI to jedyne zabezpieczenie na tej sciezce:
      # nie hostujemy tych plikow u siebie i nie mamy CSP ograniczajacego script-src.
      # Jeden znany wyjatek (Chart.js) — lista moze wylacznie malec.
      - name: Straznik SRI — skrypty z CDN maja integrity
        run: node tests/unit/cdn-sri-test.js

      # Kaskada OCR ma cztery warstwy, kazda GORSZA od poprzedniej, a zejscie w dol jest
      # ciche — awaria warstwy wyzszej nie daje bledu, tylko gorsze dane. Dwa razy w tygodniu
      # kosztowalo to diagnoze: CF Workers AI zwracal 5016 („model license not accepted")
      # wylacznie do console.log, a Proba 0 (PaddleOCR na Railway) miala `catch` z samym
      # komentarzem, wiec uspiona instancja wygladala jak brak problemu. Test pilnuje, ze
      # kazda warstwa ma zmienna z powodem, ze wszystkie trzy trafiaja do odpowiedzi 502,
      # i ze zaden catch w kaskadzie nie jest pusty. Zweryfikowany negatywnie: na kodzie
      # sprzed naprawy 6 PASS / 4 FAIL, ze wskazaniem linii pustego catch.
      - name: Straznik kaskady OCR — kazda warstwa mowi, dlaczego padla
        run: node tests/unit/ocr-cascade-errors-test.js

      # `aztec-compare.js --zapisz-prawde` zapisuje pola z kodow Aztec BEZ maskowania —
      # VIN, nr rej., serie dowodu, wlasciciela i NIP. Taki jest sens zbioru odniesienia
      # do porownywania modeli OCR, ale plik nie moze wyladowac w repozytorium: .gitignore
      # chroni tylko pliki wewnatrz drzewa i tylko gdy regula powstala ZANIM plik sie
      # pojawil (precedens: .vscode/mcp.json sledzony mimo reguly, project_ref Supabase
      # jawny przez dwa miesiace). Dlatego narzedzie ODMAWIA, a nie ostrzega. Test jest
      # behawioralny — uruchamia narzedzie i sprawdza, czy faktycznie nie zapisalo.
      # Zweryfikowany negatywnie: bez straznika 5 PASS / 4 FAIL.
      - name: Straznik zbioru odniesienia — dane osobowe nie trafiaja do repo
        run: node tests/unit/aztec-prawda-guard-test.js

      # Dwa bledy zgloszone przez uzytkownika 19.08, oba dajace FALSZYWY ODCZYT zamiast
      # awarii: (1) `uruchom-wszystko.js` raportowal „bramki nie przechodza" przy 15/15
      # PASS, bo shell:true na Windowsie rozbijal sciezke ze spacja („Program flotowy");
      # to samo falszowalo `wrangler whoami` -> „brak poswiadczen". (2) `env-setup.js`
      # pokazywal wszystkie klucze jako puste przy poprawnie zapisanych wartosciach, bo
      # dzielil po '\n' zamiast /\r?\n/ i na CRLF wzorzec nie pasowal. Obie klasy sa
      # NIEWIDOCZNE na Linuksie (shell wylaczony, pliki z LF), a CI stoi na ubuntu —
      # wiec bez tego testu nic ich nie zlapie. Zweryfikowany negatywnie: po przywroceniu
      # obu bledow 6 PASS / 2 FAIL.
      - name: Straznik narzedzi — Windows, spacje w sciezce, CRLF
        run: node tests/unit/tooling-windows-test.js

      # Lista pol dowodu rejestracyjnego zyla w CZTERECH niezaleznych kopiach: mapa _DR_NEW
      # (pozycje w ladunku Aztec), prompt OCR, mapowanie CEPiK i skrypt budujacy Excel.
      # Ten projekt przerabial rozjazd takich kopii trzykrotnie — dwie tablice CO2, dwie
      # listy zrodel raportow, dwie wersje ZXing — i za kazdym razem objawialo sie to
      # CICHYMI ZLYMI DANYMI. Bramka pilnuje, ze kazdy klucz uzywany w kodzie istnieje
      # w katalogu modules/dr-fields.js, ze flaga `aztec` zgadza sie z _DR_NEW co do
      # zbioru, oraz ze pola osobowe i pola DT-1 sa oznaczone. Przy pierwszym uruchomieniu
      # znalazla realny rozjazd: rokPierwszejRej vs rokProd (DWA ROZNE pola) oraz trzy
      # nazwy na jedno pole przeznaczenia.
      - name: Straznik katalogu pol DR — jedno zrodlo prawdy
        run: node tests/unit/dr-fields-test.js

      # Narzedzie CEPiK zalalo publiczne API panstwowe (45 zadan zamiast 3, odstep
      # pomijany na sciezce bledu), a tablica wojewodztw miala 15 kodow zamiast 16, wiec
      # kujawsko-pomorskie bylo nieosiagalne. Oba objawy byly NIEME: CEPiK na zly kod
      # zwraca pusty wynik, nie blad. Bramka czyta funkcje wprost z pliku produkcyjnego.
      - name: Straznik zapytan do CEPiK — limity API i budzet zadan
        run: node tests/unit/cepik-batch-test.js

      # Dziedzina kategorii homologacyjnej istnieje w DWOCH miejscach, bo katalog
      # jest w JS, a parser OCR w Pythonie (i buduje sie z samego ocr-service/,
      # wiec dr-fields.js nie trafia nawet do jego obrazu). Kopia jest konieczna —
      # ta bramka sprawia, ze jest bezpieczna. Kategoria to pole DT-1, wiec rozjazd
      # konczy sie zla kategoria podatkowa, cicho.
      - name: Spojnosc dziedzin DR — katalog JS vs parser OCR
        run: node tests/unit/dr-domains-sync-test.js

      # Stawki DT-1 trafiaja wprost do deklaracji podatkowej, a modul deklarowal
      # "Warszawa 2026" bez zadnego sprawdzenia wobec zrodla. Liczba wpisana
      # z pamieci wyglada w arkuszu identycznie jak odczytana z uchwaly.
      - name: Stawki DT-1 zgodne z uchwala Rady m.st. Warszawy
        run: node tests/unit/gminy-rates-test.js

      # 109 z 1318 rekordow DR mialo identyfikator modelu AI w polu pojazdu
      # (WE129YG: model = "qwen/qwen3.6-27b"). Wyciek koperty odpowiedzi, nie
      # halucynacja modelu. Bramka pilnuje wzorca z OBU stron: za waski przestaje
      # lapac modele, za szeroki zaczyna kasowac numery homologacji.
      - name: Identyfikator modelu AI nie wchodzi do pol pojazdu
        run: node tests/unit/ocr-model-leak-test.js

      # Na dowodzie F.1 i F.2 to DWIE ROZNE wielkosci: techniczna i zarejestrowana.
      # Podstawa DT-1 jest F.2. Prompt kazal wczesniej "wybrac WIEKSZA", czyli
      # brac mase techniczna. Bramka pilnuje tez kontroli F.2 <= F.1 — bez niej
      # zly odczyt (Sprinter z F.2 = 37 000) wpisalby do deklaracji mase
      # dziesieciokrotnie zawyzona.
      - name: Podstawa DT-1 to F.2, nie F.1
        run: node tests/unit/dmc-podstawa-test.js

      # Ustalone z wlascicielem 01.09.2026: pojazd zarejestrowany poza Polska nie
      # podlega DT-1 (dotyczy floty litewskiej). Pole krajRejestracji istnialo juz
      # w karcie pojazdu, ale TaxEngine go nie czytal. Pulapka: pole jest wolnym
      # tekstem i w wiekszosci floty PUSTE - puste MUSI oznaczac Polske (opodatkowany),
      # inaczej zmiana zwolnilaby cala krajowa flote z dnia na dzien.
      - name: DT-1 — pojazd zarejestrowany poza Polską nie jest opodatkowany
        run: node tests/unit/dt1-foreign-plate-test.js

      # tools/sync.js synchronizuje dwa komputery „jednym poleceniem" — czyli jest
      # dokladnie tym rodzajem wygody, przy ktorej ktos kiedys uruchomi ja na `main`.
      # A push do main w tym repo JEST wdrozeniem na produkcje (deploy-worker.yml dla
      # worker/**, Cloudflare Pages dla reszty). Bramka pilnuje, ze odmowa istnieje
      # I ze stoi PRZED pushem — funkcja poprawna, ale wywolana po wysylce, nic nie chroni.
      # Zweryfikowana negatywnie na dwa tryby awarii: 14/3 po usunieciu main z listy,
      # 15/2 po przestawieniu pusha przed straznika.
      - name: Straznik mostu — sync.js nie wysle na main
        run: node tests/unit/sync-guard-test.js

      # Uogolnienie straznika kolumn `vehicles` na CALY backend. Pierwsze uruchomienie
      # na 862 zapytaniach znalazlo 16 odwolan do nieistniejacych kolumn i 3 do tabel,
      # ktorych zaden schema_v* nie tworzy — w tabelach, ktorych tamta bramka nie
      # ogladala. Skutek zalezy od `.catch()`: z nim ciche zera i puste listy, bez niego
      # 500. Ciche zera sa grozniejsze, bo wygladaja jak poprawny wynik.
      # Listy ZNANE_* moga wylacznie malec — wpis oznacza endpoint, ktory dzis nie dziala.
      - name: Straznik kolumn — WSZYSTKIE zapytania workera kontra schemat
        run: node tests/unit/worker-columns-test.js

      # worker/index.js ma TRZY parsery CSV paliwowego, bo powstawaly osobno. Raport ORLEN
      # ma OBIE kolumny kwoty — „Wartosc netto" i „Wartosc brutto" — a zaden z parserow nie
      # odrozznial ich ZNACZENIEM: dwa zgadywaly po kolejnosci kolumn (jeden bral pierwsza
      # pasujaca, drugi ostatnia), trzeci porownywal naglowki doslownie i nie znajdowal nic,
      # wiec kwota wychodzila null. Roznica to stawka VAT, a kwota idzie wprost do raportow
      # ESG i eksportu JPK. Bramka sprawdza wszystkie trzy na tej samej tablicy przypadkow —
      # dopoki istnieja trzy kopie, to jedyne, co nie pozwoli im sie znowu rozjechac.
      - name: Straznik importu paliwa — kwota brutto, nie netto
        run: node tests/unit/fuel-csv-test.js

      # Audyt 01.09.2026: 708 zapytan SELECT/UPDATE/DELETE w workerze, 84 bez
      # `company_id` w tresci. Kazde zweryfikowane recznie z pelnym kontekstem
      # funkcji (PRE-CHECK/PRE-SCOPED/WLASNY-ZAPIS/TOKEN/DYNAMIC-WHERE/ADMIN/CRON —
      # patrz naglowek pliku) — zero realnych luk. Lista ZNANE_BEZPIECZNE moze
      # tylko malec; nowe zapytanie bez company_id i bez wpisu na liscie to porazka.
      - name: Straznik izolacji tenanta — company_id w kazdym zapytaniu
        run: node tests/unit/tenant-scope-test.js
