name: JS syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax (node --check)
        run: |
          set -e
          for f in app.js sw.js; do
            [ -f "$f" ] && node --check "$f"
          done
          for f in modules/*.js worker/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      # node --check waliduje app.js, ale NIE kod, ktory app.js emituje jako tekst
      # (bookmarklet DT-1 -> Warszawa). Ten test parsuje i uruchamia wygenerowany
      # skrypt oraz sprawdza escapowanie danych. Bez zaleznosci - nie wymaga npm ci.
      - name: Bookmarklet DT-1 → Warszawa (regresja)
        run: node tests/unit/warsaw-bookmarklet-test.js

      # Straznik nocnego automatu migracji. Glob `worker/schema_v*.sql` dopasowywal
      # takze pliki *_ROLLBACK.sql, ktore leksykograficznie wykonywaly sie tuz po
      # swoich migracjach i kasowaly wlasnie utworzone tabele. Zaden inny test tego
      # nie widzial: migration-check porownuje pliki schema miedzy soba, a d1-schema-diff
      # wymaga dostepu do bazy. Ten dziala statycznie, bez sieci i bez zaleznosci.
      - name: Straznik globa migracji (ROLLBACK, kolejnosc)
        run: node tests/unit/migration-glob-test.js
