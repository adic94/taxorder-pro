name: Claude Code — automatyczna implementacja

# Jak używać:
#   1. Otwórz Issue lub PR i wpisz: @claude zrób X
#   2. Dodaj label "claude" do Issue — Claude automatycznie wdroży zmianę
#   3. W komentarzu PR: @claude popraw ten fragment

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Uruchom tylko gdy SPEŁNIONE OBA warunki:
    #   1. autor ma uprawnienia do repozytorium (OWNER / MEMBER / COLLABORATOR),
    #   2. komentarz zawiera "@claude" albo Issue ma label "claude".
    #
    # ⚠️ WARUNEK 1 JEST WARUNKIEM BEZPIECZEŃSTWA, NIE WYGODĄ — nie usuwaj go.
    #
    # Ten job dostaje `contents: write` i `secrets.ANTHROPIC_API_KEY`. Bez sprawdzenia
    # autora wyzwalaczem jest sam TEKST komentarza, a komentarz może napisać każdy, kto
    # ma dostęp do repozytorium. Dziś repo jest prywatne, więc krąg jest wąski — ale:
    #
    #   • gdyby repo stało się PUBLICZNE, dowolna osoba z internetu założyłaby Issue
    #     z "@claude ..." i dostała agenta z prawem zapisu, na naszym kluczu API.
    #     Uwaga na asymetrię: `pull_request` z forka NIE dostaje sekretów, ale
    #     `issue_comment` biegnie w kontekście repo bazowego i sekrety DOSTAJE.
    #   • push do `worker/**` uruchamia deploy-worker.yml, czyli wdrożenie na
    #     produkcję — droga od obcego komentarza do produkcji jest prosta.
    #   • dodanie współpracownika do repo dziś rozszerza ten krąg bez żadnego sygnału.
    #
    # `author_association` bierze się ze zdarzenia GitHuba i nie da się go podrobić
    # treścią komentarza.
    #
    # SPRAWDZAMY AUTORA TEGO TEKSTU, KTÓRY STAJE SIĘ PROMPTEM — osobno dla każdego
    # zdarzenia, nigdy jednym wspólnym OR-em. Wspólny OR jest dziurawy: przepuszczałby
    # obcy komentarz pod Issue założonym przez właściciela, bo `issue.author_association`
    # byłoby wtedy OWNER, mimo że promptem jest treść komentarza obcej osoby.
    #
    # Dla `issues` (oba warianty) sprawdzamy autora ZGŁOSZENIA, nie osoby nadającej
    # label — bo to treść zgłoszenia trafia do Claude jako polecenie. Świadomy skutek:
    # nadanie labelu "claude" na Issue obcej osoby NIE uruchomi joba. Tak ma być —
    # inaczej wystarczyłoby napisać zgłoszenie i poczekać, aż ktoś je otaguje.
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        && (
          (github.event.action == 'labeled' && github.event.label.name == 'claude') ||
          (github.event.action == 'opened' && contains(github.event.issue.body, '@claude'))
        ))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Kontekst projektu — Claude dostaje te instrukcje automatycznie
          custom_instructions: |
            Jesteś asystentem dla projektu TaxOrder Pro — systemu zarządzania flotą pojazdów.
            Stack: Cloudflare Pages SPA + Worker (REST) + D1 (SQLite) + R2 (pliki).
            Worker URL: https://taxorder-pro-api.adamus1000.workers.dev
            Język UI: polski. Język kodu (zmienne, funkcje): angielski.

            BEZPIECZEŃSTWO — OBOWIĄZKOWE:
            - XSS: esc() obowiązkowe przy każdym innerHTML z danymi użytkownika
            - onclick z danymi: zawsze data-* + dataset.*, nigdy inline interpolacja
            - Fallback numeryczny: ?? nie ||  (szczególnie dmc, rok, miesiacePodatku)
            - Nowe tabele D1: zawsze CREATE TABLE IF NOT EXISTS w nowym pliku schema_vN.sql
            - Service Worker: przy nowych <script> w index.html → bump CACHE_NAME w sw.js

            Wdrożenie:
            - Worker: wrangler deploy (GitHub Action deploy-worker.yml robi to automatycznie)
            - Frontend: git push → Cloudflare Pages auto-deploy
          timeout_minutes: 30
